{{- /*
The proxy's configuration, held in a template of its own so the Deployment can
hash exactly what the ConfigMap carries. Hashing the values that feed it is not
the same thing: a key outside this block - monitoring, the model name - changes
the file without changing the hash, and the pods keep serving the old one.
*/}}
{{- define "flakegraph.gatewayConfig" -}}
{{- $litellm := .Values.gateway.litellm -}}
{{- $upstream := $litellm.upstream -}}
model_list:
{{- if include "flakegraph.engineUpstream" . }}
{{- /*
The in-cluster engines, through the placement router. One alias per consumer
class, each presenting a different upstream key: the sidecar maps the key to
a band, so which alias a virtual key may call is its priority.
*/}}
{{- range $class, $secretKey := dict "interactive" $litellm.upstreamKeySecret.interactiveKey "dev" $litellm.upstreamKeySecret.devKey "batch" $litellm.upstreamKeySecret.batchKey }}
  - model_name: {{ index $litellm.aliases $class }}
    litellm_params:
      model: hosted_vllm/{{ $.Values.modelServing.model.name }}
      api_base: {{ include "flakegraph.inferenceRouterEndpoint" $ }}
      api_key: os.environ/{{ $secretKey }}
      {{- if include "flakegraph.lanesEnabled" $ }}
      # The lane the router should place this class in. Set here, per alias,
      # because the proxy does not forward a client's own headers: the lane
      # follows the key a caller holds, and a caller cannot claim another.
      extra_headers:
        {{ include "flakegraph.laneHeader" $ }}: {{ ternary "batch" "people" (eq $class "batch") }}
      {{- end }}
{{- end }}
{{- else }}
{{- /*
An external OpenAI-compatible provider. Every alias resolves to each model
named, so consumers keep the alias vocabulary - the batch pipeline still asks
for llm-batch - and the provider sees one key. Several models under one alias
are a LiteLLM deployment group, which it balances across.
*/}}
{{- if not $upstream.models }}
{{- fail "gateway.litellm.upstream.type=external needs at least one entry in gateway.litellm.upstream.models, spelled as LiteLLM names providers (openai/gpt-4o, ollama/qwen3:8b, hosted_vllm/Qwen/Qwen3-8B)." }}
{{- end }}
{{- range $class, $alias := $litellm.aliases }}
{{- range $model := $upstream.models }}
  - model_name: {{ $alias }}
    litellm_params:
      model: {{ $model | quote }}
      {{- with $upstream.apiBase }}
      api_base: {{ . | quote }}
      {{- end }}
      {{- if $upstream.apiKeySecret.name }}
      api_key: os.environ/FLAKEGRAPH_UPSTREAM_API_KEY
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.embeddingServing.enabled }}
{{- /*
The embedding server, under the checkpoint's own name. It checks no key of its
own - its network policy admits only this proxy - so the key here is a
placeholder the OpenAI client insists on; the caller's virtual key is what is
checked, here, and it must list this model.
*/}}
  - model_name: {{ .Values.embeddingServing.model.name }}
    litellm_params:
      model: openai/{{ .Values.embeddingServing.model.name }}
      api_base: {{ include "flakegraph.embeddingServingEndpoint" . }}
      api_key: unused
      # The proxy's OpenAI client asks for base64 vectors unless told
      # otherwise, and the pooling server accepts only float: without this
      # every call a client makes without naming a format - the pipeline's
      # own adapter among them - is refused with a 400.
      encoding_format: float
      # Under the pipeline's own 120-second embedding timeout, so the proxy has
      # given a call up before its caller sends it again.
      timeout: 100
    model_info:
      mode: embedding
{{- end }}
{{- range $entry := $litellm.extraModelList }}
  - {{ toYaml $entry | nindent 4 | trim }}
{{- end }}
{{- if .Values.embeddingServing.enabled }}
router_settings:
  # The proxy does not stop an upstream request when its caller gives up, and
  # by default it retries a timed-out embedding several times over. Behind a
  # busy server each caller retry then adds requests nobody is waiting for,
  # the queue outgrows every timeout, and no call completes. The caller
  # retries for itself, so the proxy sends each embedding call once.
  model_group_retry_policy:
    {{ .Values.embeddingServing.model.name }}:
      TimeoutErrorRetries: 0
      InternalServerErrorRetries: 0
{{- end }}
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  {{- if $litellm.spendLogging.enabled }}
  # The batch pipeline is metered like every other tenant, which at corpus
  # scale is millions of rows. Batching the writes keeps that off the
  # request path instead of paying a database round trip per completion.
  proxy_batch_write_at: {{ $litellm.spendLogging.batchWriteIntervalSeconds }}
  {{- else }}
  disable_spend_logs: true
  {{- end }}
litellm_settings:
  # The pipeline sends chat_template_kwargs to disable a reasoning model's
  # free-form thinking before strict JSON generation. Dropping unrecognised
  # parameters would remove it silently, and the failure would surface as
  # empty extractions rather than as an error.
  drop_params: false
  # The proxy's own usage reports to its maintainers. See values.yaml.
  telemetry: {{ $litellm.telemetry }}
  # message_order moves system and developer messages a caller placed
  # mid-conversation to the front, where the engine's chat template accepts
  # them; a harness resuming a session sends them that way and would
  # otherwise be refused. Prometheus serves /metrics: request, token, and
  # spend series per virtual key and alias, which is where the fleet's
  # per-consumer view of inference lives. Off without a scraper, because the
  # callback is not free per request. stable_schemas keeps request-specific ids
  # out of the schemas sent to a model whose entry sets
  # model_info.stable_schemas; see the module docstring.
  callbacks:
    - message_order.instance
    - stable_schemas.instance
    {{- if .Values.monitoring.enabled }}
    - prometheus
    {{- end }}
  {{- if .Values.monitoring.enabled }}
  # The proxy asks for a key on /metrics unless told otherwise, and the
  # scraper presents none. The series carry counts and spend per key alias,
  # never a key or a prompt.
  require_auth_for_metrics_endpoint: false
  {{- end }}
{{- end }}
{{- if .Values.gateway.enabled }}
{{- $litellm := .Values.gateway.litellm }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flakegraph.gatewayName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  # One alias per consumer class, each presenting a different upstream key. The
  # sidecar maps that key to a band, so a caller's priority is decided by which
  # alias its virtual key may reach — never by anything in the request body.
  # Restrict each virtual key to a single alias and the mapping is unforgeable.
  config.yaml: |
    {{- include "flakegraph.gatewayConfig" . | nindent 4 }}
  # Loaded by the proxy from beside its config file; see the module docstring.
  message_order.py: |
    {{- .Files.Get "gateway/message_order.py" | nindent 4 }}
  stable_schemas.py: |
    {{- .Files.Get "gateway/stable_schemas.py" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flakegraph.gatewayName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ $litellm.service.type }}
  selector:
    {{- include "flakegraph.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ $litellm.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq $litellm.service.type "NodePort") $litellm.service.nodePort }}
      nodePort: {{ $litellm.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flakegraph.gatewayName" . }}
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ $litellm.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flakegraph.selectorLabels" (dict "root" . "component" "gateway") | nindent 8 }}
      annotations:
        # Two hashes, two reasons to roll. The values one catches changes to
        # the Secret references and arguments below; the config one catches
        # the file, whose inputs are not all under gateway.litellm.
        checksum/gateway-config: {{ $litellm | toJson | sha256sum }}
        checksum/config: {{ include "flakegraph.gatewayConfig" . | sha256sum }}
    spec:
      {{- if .Values.scheduling.priorityClasses.enabled }}
      priorityClassName: {{ include "flakegraph.servingPriorityClassName" . }}
      {{- end }}
      serviceAccountName: {{ include "flakegraph.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $litellm.podSecurityContext | nindent 8 }}
      {{- with $litellm.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $litellm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $litellm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $litellm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $litellm.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: litellm
          image: {{ include "flakegraph.componentImage" $litellm.image }}
          imagePullPolicy: {{ $litellm.image.pullPolicy }}
          args: [--config, /etc/litellm/config.yaml, --port, {{ $litellm.service.port | quote }}]
          env:
            # Composed rather than taken straight from the Secret so the schema
            # travels with it; Kubernetes expands $(VAR) against earlier entries.
            - name: FLAKEGRAPH_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: DATABASE_URL
              value: {{ printf "$(FLAKEGRAPH_DATABASE_URI)%s" $litellm.databaseUrlSuffix | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $litellm.virtualKeySecret.name }}
                  key: {{ $litellm.virtualKeySecret.masterKey }}
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $litellm.virtualKeySecret.name }}
                  key: {{ $litellm.virtualKeySecret.saltKey }}
            {{- if $litellm.localModelCostMap }}
            # Price from the bundled cost map instead of fetching one from
            # GitHub at every start. See values.yaml.
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            {{- end }}
            # The non-root image unpacks its admin UI into this directory on
            # startup; pointed at the emptyDir below so the root filesystem
            # can stay read-only.
            - name: LITELLM_UI_PATH
              value: /var/lib/litellm/ui
            - name: HOME
              value: /tmp
            {{- if include "flakegraph.engineUpstream" . }}
            {{- range $class, $secretKey := dict "interactive" $litellm.upstreamKeySecret.interactiveKey "dev" $litellm.upstreamKeySecret.devKey "batch" $litellm.upstreamKeySecret.batchKey }}
            - name: {{ $secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $litellm.upstreamKeySecret.name }}
                  key: {{ $secretKey }}
            {{- end }}
            {{- else if $litellm.upstream.apiKeySecret.name }}
            - name: FLAKEGRAPH_UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $litellm.upstream.apiKeySecret.name }}
                  key: {{ $litellm.upstream.apiKeySecret.key }}
            {{- end }}
            {{- with $litellm.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $litellm.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $litellm.resources | nindent 12 }}
          securityContext:
            {{- toYaml $litellm.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Everything the proxy writes at startup - the unpacked admin UI
            # and Prisma's working files - lands here, which is what lets the
            # image's own filesystem stay read-only.
            - name: state
              mountPath: /var/lib/litellm
            {{- with $litellm.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flakegraph.gatewayName" . }}
        - name: tmp
          emptyDir: {}
        - name: state
          emptyDir: {}
        {{- with $litellm.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if $litellm.autoscaling.enabled }}
{{- /* Sized against total request rate, which the batch pipeline dominates —
     not against tenant count. CPU is the observable proxy for that here. */}}
{{ include "flakegraph.cpuHpa" (dict "root" . "name" (include "flakegraph.gatewayName" .) "kind" "Deployment" "component" "gateway" "autoscaling" $litellm.autoscaling) }}
{{- end }}
{{- end }}
