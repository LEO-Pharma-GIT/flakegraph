{{- /*
Further vLLM pooling servers - embedding models and rerankers - beside the
chart's embedding server, each reached only through the gateway, which issues
the keys and meters the calls. Unlike the embedding server, whose weights come
from the application image, each downloads its model on first start into its
own cache (through modelServing's Hugging Face token and any CA bundle named in
its extraEnv/extraVolumes), so adding one needs no image rebuild. Each is
named in the gateway by an extraModelList entry pointing at its Service:
http://<release>-<name>:<port>/v1.
*/ -}}
{{- if .Values.poolingServers }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flakegraph.fullname" . }}-pooling-python
  labels:
    {{- include "flakegraph.labels" . | nindent 4 }}
data:
  sitecustomize.py: |
    {{- .Files.Get "serving/sitecustomize.py" | nindent 4 }}
{{- end }}
{{- range $server := .Values.poolingServers }}
{{- if not $.Values.gateway.enabled }}
{{- fail "poolingServers are reached through the gateway; enable gateway as well." }}
{{- end }}
{{- $name := include "flakegraph.poolingServerName" (dict "root" $ "server" $server) }}
{{- $component := printf "pooling-%s" $server.name }}
{{- $port := $server.port | default 8000 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "flakegraph.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $server.replicas | default 1 }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  # A server starts only if its whole GPU share is free at that moment: a
  # surge pod beside the one it replaces would find it taken and fail.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flakegraph.selectorLabels" (dict "root" $ "component" $component) | nindent 8 }}
      annotations:
        checksum/pooling-python: {{ $.Files.Get "serving/sitecustomize.py" | sha256sum | trunc 16 }}
    spec:
      {{- if $.Values.scheduling.priorityClasses.enabled }}
      priorityClassName: {{ include "flakegraph.servingPriorityClassName" $ }}
      {{- end }}
      serviceAccountName: {{ include "flakegraph.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- with $server.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.modelServing.podSecurityContext | nindent 8 }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $server.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "flakegraph.selectorLabels" (dict "root" $ "component" $component) | nindent 14 }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ include "flakegraph.componentImage" $.Values.modelServing.image }}
          imagePullPolicy: {{ $.Values.modelServing.image.pullPolicy | default "IfNotPresent" }}
          args:
            - {{ $server.model | quote }}
            - --runner
            - pooling
            - --host
            - 0.0.0.0
            - --port
            - {{ $port | quote }}
            - --gpu-memory-utilization
            - {{ $server.gpuMemoryUtilization | quote }}
            - --max-model-len
            - {{ $server.maxModelLen | default 8192 | quote }}
            # Pooling runs one forward pass per input and never decodes.
            - --enforce-eager
            {{- range $server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: HOME
              value: /tmp/vllm-home
            - name: HF_HUB_CACHE
              value: /models/hub
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            {{- with $.Values.modelServing.huggingFaceTokenSecret }}
            {{- if .name }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key | default "HF_TOKEN" }}
                  optional: true
            {{- end }}
            {{- end }}
            # No resource claim: the pod shares the node's device with the
            # engine there, as the embedding server and document parsing do.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: PYTHONPATH
              value: /opt/flakegraph-python
            {{- if eq ($server.freeMemory | default "available") "free" }}
            # Count MemFree, not MemAvailable, as the device's free memory:
            # see serving/sitecustomize.py.
            - name: FLAKEGRAPH_UMA_FREE_MEMORY
              value: free
            {{- end }}
            {{- with $server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            # A first start downloads the model.
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml ($server.resources | default dict) | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.modelServing.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
            - name: python
              mountPath: /opt/flakegraph-python
              readOnly: true
            {{- with $server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: models
          emptyDir:
            sizeLimit: {{ $server.modelCacheSizeLimit | default "20Gi" }}
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: python
          configMap:
            name: {{ include "flakegraph.fullname" $ }}-pooling-python
        {{- with $server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "flakegraph.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "flakegraph.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # The server checks no key: only the gateway may reach it.
    - from:
        - podSelector:
            matchLabels:
              {{- include "flakegraph.selectorLabels" (dict "root" $ "component" "gateway") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
    {{- if $.Values.monitoring.enabled }}
    - from:
        {{- include "flakegraph.prometheusPeer" $ | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
{{- end }}
